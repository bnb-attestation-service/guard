# AgentGuard CI gate — drop into .github/workflows/agentguard.yml
#
# Fails the build if any committed skill/agent artifact scans at or above `--fail-on`, and annotates
# the pull request with each finding through GitHub Code Scanning.
name: agentguard
on: [push, pull_request]

permissions:
  contents: read
  security-events: write      # required to upload SARIF

jobs:
  agent-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: install aguard
        run: go install github.com/bnb-attestation-service/agent-guard/cmd/aguard@latest

      # Point --root at the dir that holds your skills/ (here: the repo itself).
      #
      # continue-on-error so the SARIF still uploads when the gate fails — otherwise the run you most
      # want annotations for is the one that produces none.
      - name: scan as a gate
        id: scan
        continue-on-error: true
        run: aguard scan --root . --fail-on high --sarif aguard.sarif

      - name: annotate the pull request
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aguard.sarif

      # Re-assert the gate's verdict, now that the annotations are in.
      - name: fail if the gate failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
